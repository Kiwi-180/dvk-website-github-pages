<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="icon" href="{{ '/assets/img/logo-128.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <meta name="color-scheme" content="light dark">
  <script>
    // gespeichertes Theme vor dem Rendern setzen (kein Aufblitzen)
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  {% include header.html %}

  <main id="inhalt">
    {% if page.hero %}
      {{ content }}
    {% else %}
      <header class="page-head">
        <div class="wrap">
          <h1>{{ page.title }}</h1>
          {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
        </div>
      </header>
      <div class="wrap content">
        {{ content }}
      </div>
    {% endif %}
  </main>

  {% include footer.html %}
  <script>
    document.querySelector(".theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var dunkel = root.dataset.theme
        ? root.dataset.theme === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dunkel ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });
  </script>
</body>
</html>
