<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="icon" href="{{ '/assets/img/logo-128.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {% include header.html %}

  <main id="inhalt">
    {% if page.hero %}
      {{ content }}
    {% else %}
      <header class="page-head">
        <div class="wrap">
          <h1>{{ page.title }}</h1>
          {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
        </div>
      </header>
      <div class="wrap content">
        {{ content }}
      </div>
    {% endif %}
  </main>

  {% include footer.html %}
</body>
</html>
