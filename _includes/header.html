<a class="skip" href="#inhalt">Zum Inhalt springen</a>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo-128.png' | relative_url }}" alt="" width="44" height="44">
      <span>{{ site.short_title }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menü öffnen">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>
    <nav class="site-nav" aria-label="Hauptmenü">
      <ul>
        {% for item in site.data.navigation %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button type="button" class="theme-toggle" aria-label="Helles/dunkles Design umschalten" title="Helles/dunkles Design umschalten">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
    </button>
  </div>
</header>
